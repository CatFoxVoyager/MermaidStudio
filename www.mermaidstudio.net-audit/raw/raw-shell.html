<!doctype html>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Deliberately NO viewport-fit=cover: cover makes engines report nonzero
         env(safe-area-inset-bottom) while some Android browsers still exclude
         the gesture zone from the viewport, so the safe-bottom padding under
         the bottom nav rendered as a visible strip. Without cover the insets
         are 0 everywhere, the nav sits flush at the viewport bottom, and the
         gesture zone stays browser chrome colored via theme-color. -->

    <!-- Additional SEO -->
    <meta name="keywords" content="mermaid, diagram, flowchart, sequence diagram, editor, visualization, uml, gantt chart, mindmap">
    <meta name="author" content="MermaidStudio">
    <meta name="robots" content="index, follow">
    <!-- hreflang /en /fr retirés : ces routes n'existent pas (404). L'i18n FR/EN

    <!-- Structured data: WebApplication. No fabricated aggregateRating,
         no HowTo (deprecated Sept 2023), no FAQPage (rich results retired

    {
      "@context": "https://schema.org",

      "name": "MermaidStudio",

      "description": "Free, open-source Mermaid diagram editor with in-browser AI (WebGPU), drag-and-drop visual editor, folders and version history. No account — everything stays on your device.",
      "applicationCategory": "DesignApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript. AI features require a WebGPU-capable browser.",
      "inLanguage": ["en", "fr"],
      "isAccessibleForFree": true,
      "image": "https://www.mermaidstudio.net/og-image.png",
      "license": "https://opensource.org/licenses/MIT",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "author": { "@type": "Person", "name": "Jérémie Dufault", "url": "https://jeremiedufault.ca" },
      "featureList": [
        "In-browser AI diagram generation via WebGPU (local LLM)",
        "Drag-and-drop visual editor over the live Mermaid preview",
        "Multi-tab workspace with folders, tags and version history",
        "SVG/PNG export with themes and custom styling",
        "Offline-capable PWA with English and French UI"
      ],
      "softwareVersion": "2.1.0",
      "codeRepository": "https://github.com/CatFoxVoyager/MermaidStudio",
      "sameAs": [
        "https://github.com/CatFoxVoyager/MermaidStudio",
        "https://www.linkedin.com/in/jeremiedufault/"
      ]
    }
    </script>

    <!-- PWA -->
    <!-- First-paint fallbacks follow the system scheme; useTheme then syncs
         both metas to the app's active theme (browser chrome — URL bar and
         the Android edge-to-edge gesture zone — is painted from theme-color,
         not from the page). -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafaf9">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="MermaidStudio">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">

    <!-- Resource Hints for Performance -->

    <!-- Google Fonts with display swap for non-blocking render.
         crossorigin: required under COEP require-corp (see vercel.json) —
         fonts.googleapis.com serves ACAO:* so the CORS-qualified fetch passes. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" crossorigin>

  <body>
    <div id="root">
      <!-- Boot splash: removed by React's first render (it replaces #root's
           children), or self-fades after 8s if the bundle fails. -->
      <div id="boot-splash" aria-hidden="true">
        <div class="boot-spinner"></div>
        <div class="boot-title">MermaidStudio</div>
      </div>
      <!-- Hard fallback (iter-14 P0): when the app stylesheet 500s, the CSS
           fade above dies with it and the spinner runs forever — observed
           live. This inline script needs no stylesheet: after 12s without a
           React mount it swaps the spinner for an error + reload button. -->
      <script>
        (function(){
          setTimeout(function(){
            var s=document.getElementById('boot-splash');
            if(s&&s.parentNode){ /* React replaced #root children => s detached */
              s.removeAttribute('aria-hidden');
              s.innerHTML='<div class="boot-title">MermaidStudio failed to load.</div>'
                +'<p style="margin:0;opacity:.85">Check your connection, then</p>'
                +'<button onclick="location.reload()" style="margin-top:.5rem;padding:.6rem 1.2rem;border-radius:.6rem;border:1px solid rgba(128,128,128,.4);background:transparent;color:inherit;font:inherit;cursor:pointer">Reload</button>';
            }
          },12000);
        })();
      </script>
      <!-- Crawlable shell content: indexed by search engines and AI crawlers,
           and shown while the app bundle loads. React replaces these children
           on first render — keep an equivalent fallback if this block changes. -->
      <!-- Shell removed for dev -->
      <noscript>
        <p>MermaidStudio is a browser-based Mermaid diagram editor and needs JavaScript to run. Source code and documentation live on <a href="https://github.com/CatFoxVoyager/MermaidStudio">GitHub</a>.</p>
      </noscript>
    </div>
  </body>
